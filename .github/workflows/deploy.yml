name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    # Primero subimos todo lo general
    - name: Deploy to S3
      run: |
        aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} --delete --exclude ".github/*" --exclude ".git/*" --exclude "*.Identifier"

    # Forzamos a que todo lo que esté en la carpeta css se marque explícitamente como text/css
    - name: Fix CSS MIME Type
      run: |
        aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/css/ s3://${{ secrets.AWS_S3_BUCKET }}/css/ --recursive --metadata-directive REPLACE --content-type "text/css"

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
